[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-reset-notifier"
version = "0.1.0"
description = "Independent, future-only AIHot Codex reset text notifications"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
codex-reset-notifier = "codex_reset_notifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
